name: "Feature request"
description: "An idea, or something you want Typmax to do"
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Please don't attach a board unless you choose to. If one is needed, we will ask."
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you picture it working. Another tool that does it well is useful to name.
  - type: input
    id: version
    attributes:
      label: Version
      description: "Help › About shows the version and build."
